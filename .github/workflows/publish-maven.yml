name: publish-maven

# Publishes the Java client (clients/java) to Maven Central when a version tag is pushed.
#
# DORMANT UNTIL SECRETS EXIST: the "deploy" step only runs when the required
# publishing secrets are configured, so this workflow is harmless on repos that
# have not set them up yet. It will build + test on every tag regardless.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   GPG_PRIVATE_KEY        ASCII-armored GPG private key used to sign artifacts
#   GPG_PASSPHRASE         passphrase for that GPG key
#   MAVEN_CENTRAL_USERNAME Sonatype Central Portal token username
#   MAVEN_CENTRAL_TOKEN    Sonatype Central Portal token value
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/java
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check publishing secrets
        id: secrets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$MAVEN_CENTRAL_USERNAME" ] && [ -n "$MAVEN_CENTRAL_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing secrets not configured; building and testing only (no deploy)."
          fi

      # Base JDK setup (used for the build-only path).
      - name: Set up JDK 17
        if: steps.secrets.outputs.ready != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # JDK setup with GPG + Central server credentials (used for the deploy path).
      - name: Set up JDK 17 with GPG and Central credentials
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Set pom version from tag
        run: mvn --batch-mode --no-transfer-progress versions:set -DnewVersion="${{ steps.version.outputs.version }}" -DgenerateBackupPoms=false

      - name: Build and test
        if: steps.secrets.outputs.ready != 'true'
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Build, sign, and deploy to Maven Central
        if: steps.secrets.outputs.ready == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress -Prelease deploy
