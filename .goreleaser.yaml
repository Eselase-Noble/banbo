# GoReleaser configuration for building cross-platform banbo binaries.
# Usage (once a GitHub token is configured): goreleaser release --clean
version: 2

project_name: banbo

before:
  hooks:
    - go mod tidy

builds:
  - id: banbo
    main: ./cmd/banbo
    binary: banbo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/Eselase-Noble/banbo/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  draft: true
